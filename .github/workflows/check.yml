name: Check challenge
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Verify a running production build over HTTP
        shell: bash
        run: |
          npm start > /tmp/checkout-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4000/health > /dev/null; then break; fi
            sleep 1
          done
          BASE_URL=http://127.0.0.1:4000 npm run smoke
      - name: Show API log if smoke failed
        if: failure()
        run: cat /tmp/checkout-api.log || true
