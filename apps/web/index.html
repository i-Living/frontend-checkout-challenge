<!doctype html>
<html lang='ru'>
    <head>
        <meta charset='UTF-8' />
        <meta name='viewport' content='width=device-width, initial-scale=1.0' />
        <title>Магазин</title>
        <script>
            try {
                var stored = JSON.parse(localStorage.getItem('checkout.theme') || 'null')
                var saved = stored && stored.state && stored.state.theme
                if (saved === 'dark' || (!saved && matchMedia('(prefers-color-scheme: dark)').matches)) {
                    document.documentElement.classList.add('dark')
                }
            } catch (e) {}
        </script>
    </head>
    <body>
        <div id='root'></div>
        <script type='module' src='/src/main.tsx'></script>
    </body>
</html>
